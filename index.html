<style>

.meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}
.count{font-size:12px;color:var(--sub)}
select{font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.card .cat{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px}
.card .src{font-size:12px;color:var(--sub)}

.card blockquote::before{content:"“";color:var(--accent);font-weight:700;margin-right:2px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 1px}
.card details.more{margin-top:8px;font-size:13px}
.card details.more summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:12.5px;list-style:none;display:inline-block;padding:2px 0}
.card details.more summary::-webkit-details-marker{display:none}
.card details.more summary::before{content:"▸ "}
.card details.more[open] summary::before{content:"▾ "}
.card details.more summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.card .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 18px;margin-top:6px;background:var(--quote);border-radius:8px;padding:10px 14px}

.card .cols ul{margin:0;padding-left:18px}
.card .cols li{margin:3px 0}

footer{font-size:12px;color:var(--sub);margin-top:28px}

<div class="wrap">
<header class="app">
  <h1>みっちー添削アーカイブ</h1>
  <p>友道先生がこれまでの添削で「実際に何を言ったか」の逆引き検索。出典：大阪大規模勉強会グループチャット（2026/8/25〜10/22）＋Aさん添削動画＋添削まとめ資料（まとめ資料作成者・9/6時点。「まとめ資料」タグで絞り込み）</p>

</header>

</div>

</div>

{"d":"まとめ","to":"全員","c":["まとめ資料","マインド"],"t":"「完成」と判定されたときの共通点（A・E・M・C（と）・D（女性））","q":"現状で完成としてもよいレベル","x":[["完成時の状態",["写真：トレーナーと利用者が一緒に写り、マンツーマン指導が一瞬で伝わる。視線がコピーへ流れる","メインコピー：十分な大きさで最初に目に入る。強調は絞られ、文章として自然に読める","キャンペーン：見出しの下に2つの特典が整理され、「0円」「無料」が主役。原稿の順番どおり","4つの特徴：ひとまとまりで認識でき、文字が読める。CTAより控えめ","CTA：補色 or 明暗差で目立ち、高さ・矢印・立体感があり「押せるボタン」に見える","原稿：レターがすべて揃い、文言・順番が原稿と一致している"]],["完成後に促されたこと",["スマホの実寸で文字の読みやすさと余白を最終確認","「もう一案」（別ターゲット／別訴求）の準備を始める","当日の学びを深めるため、別案の参考探しまで進めておく","修正説明文の誤記など、画像以外の提出物も整える"]]],"xs":"完成の条件を見る"},

{d:"10/22",to:"E",c:["マインド","レター"],t:"最初から全部できる必要はない。まず「ここをこうした理由」を一つずつ説明できるようになることが提案力につながる",q:"最初から全部できる必要はなくて、まずは「ここをこうした理由」を一つずつ説明できるようになることが、提案の力につながると思っています！そして、その中で優先順位をつけて相手に伝えることを意識しています"},
];

const CATS = ["すべて","レター","情報整理","文字","視認性","余白","CTA","写真","装飾","参考元","スマホ","実務","操作Tips","マインド","Q&A","まとめ資料"];
const catsEl = document.getElementById("cats"), listEl = document.getElementById("list"),
      qEl = document.getElementById("q"), whoEl = document.getElementById("who"), countEl = document.getElementById("count");
let activeCat = "すべて";

[...new Set(DATA.map(r=>r.to))].filter(w=>w!=="全員").sort().forEach(w=>{
  const o = document.createElement("option"); o.value = w; o.textContent = "宛先：" + w + (w==="A"?"（動画含む）":"") ; whoEl.appendChild(o);
});
CATS.forEach(c=>{
  const b = document.createElement("button"); b.textContent = c;
  b.setAttribute("aria-pressed", c===activeCat);
  b.onclick = ()=>{ activeCat = c; [...catsEl.children].forEach(x=>x.setAttribute("aria-pressed", x===b)); render(); };
  catsEl.appendChild(b);
});

function esc(s){ return s.replace(/[&<>"]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function hl(s, q){
  if(!q) return esc(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(s);
  return esc(s.slice(0,i)) + "<mark>" + esc(s.slice(i,i+q.length)) + "</mark>" + hl(s.slice(i+q.length), q);
}
function render(){
  const q = qEl.value.trim(), who = whoEl.value;
  const rows = DATA.filter(r =>
    (activeCat==="すべて" || r.c.includes(activeCat)) &&
    (!who || r.to===who) &&
    (!q || (r.t + (r.q||"") + r.c.join("") + (r.w||"") + (r.x||[]).flatMap(s=>s[1]).join("")).toLowerCase().includes(q.toLowerCase()))
  );
  countEl.textContent = rows.length + "件 / 全" + DATA.length + "件";
  listEl.innerHTML = "";
  if(!rows.length){ listEl.innerHTML = '<p class="empty">見つかりませんでした。別のキーワードでどうぞ＾＾</p>'; return; }
  rows.forEach(r=>{
    const card = document.createElement("article"); card.className = "card";
    const inside = !!q && ((r.x||[]).flatMap(s=>s[1]).join("") + (r.w||"")).toLowerCase().includes(q.toLowerCase());
    card.innerHTML =
      '<div class="head">' + r.c.map(c=>'<span class="cat">'+esc(c)+'</span>').join("") +
      '<span class="src">' + esc(r.d) + '・' + (r.to==="全員" ? '全員宛' : esc(r.to) + 'さん宛') + '</span></div>' +
      '<h3>' + hl(r.t, q) + '</h3>' +
      (r.q ? '<blockquote>' + hl(r.q, q) + '</blockquote>' : '') +
      (r.x ? '<details class="more"' + (inside ? ' open' : '') + '><summary>' + esc(r.xs || '中身を見る') + '</summary><div class="cols">' +
          r.x.map(s=>'<div><h4>'+esc(s[0])+'</h4><ul>'+s[1].map(i=>'<li>'+hl(i,q)+'</li>').join("")+'</ul></div>').join("") +
        '</div></details>' : '') +
      (r.w ? '<p class="who">この指摘が出た相手：' + hl(r.w, q) + '</p>' : '');
    listEl.appendChild(card);
  });
}
qEl.addEventListener("input", render);
whoEl.addEventListener("change", render);
render();
</script>
